
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"...>
<meta name="google-site-verification" content="..">
    <title>My AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <h2>My AI</h2>

            <button class="new-chat">+ New Chat</button>

            <div class="menu">
                <p>🔍 Search</p>
                <p>💬 Chats</p>
                <p>📁 Projects</p>
            </div>

            <h4>TOOLS</h4>

            <div class="tools">
                <p>💻 Coding</p>
                <p>📄 PDF Analyzer</p>
                <p>📝 AI Writer</p>
                <p>📊 Data Analyzer</p>
                <p>🔎 Research</p>
                <p>🎨 Image Generator</p>
            </div>

            <div class="settings">
                ⚙️ Settings
            </div>

        </aside>


        <main class="chat">

            <header>
                <h3>My AI</h3>
            </header>

            <section class="welcome">

                <h1>How can I help you?</h1>

                <p>Ask anything or choose a tool.</p>

            </section>


            <div class="input-box">

                <button>📎</button>

                <input
                    type="text"
                    placeholder="Ask anything..."
                >

                <button>🎤</button>

                <button class="send">➤</button>

            </div>

        </main>

    </div>
<script src="script.js"></script>
</body>
</html>
